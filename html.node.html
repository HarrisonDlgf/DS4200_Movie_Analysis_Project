<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: sans-serif;
    }
    .node text {
      pointer-events: none;
      font-size: 30px;
    }
  </style>
</head>
<body>

<h2>Movie, Genre and Company Directed Network</h2>
<svg width="2500" height="1000"></svg>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
d3.json("network.json").then(data => {

  const width = 2000, height = 1700;

  const svg = d3.select("svg")
      .attr("width", width)
      .attr("height", height);

  const color = d3.scaleOrdinal()
    .domain(["movie", "genre", "company"])
    //made color blind safe
    .range(["#1b9e77", "#d95f02", "#7570b3"]);

  const size = d3.scaleSqrt()
    .domain([0, d3.max(data.nodes, d => d.revenue || 0)])
    .range([3, 25]);

  const tooltip = d3.select("body")
      .append("div")
      .style("position", "absolute")
      .style("background", "white")
      .style("border", "1px solid #595959")
      .style("padding", "8px")
      .style("border-radius", "5px");

  const simulation = d3.forceSimulation(data.nodes)
  .force("link", d3.forceLink(data.links)
      .id(d => d.id)
      .distance(150)
      .strength(0.3))
  .force("charge", d3.forceManyBody().strength(-180)) // pushes nodes apart
  .force("center", d3.forceCenter(width / 2, height / 2)) // keeps graph centered
  .force("collide", d3.forceCollide().radius(d => size(d.revenue) + 12));

  const link = svg.append("g")
      .attr("stroke", "#595959")
      .selectAll("line")
      .data(data.links)
      .enter()
      .append("line");

  const node = svg.append("g")
      .selectAll("circle")
      .data(data.nodes)
      .enter()
      .append("circle")
      .attr("r", d => d.type === "movie" ? size(d.revenue) : 10)
      .attr("fill", d => color(d.type))
      .on("mouseover", (event, d) => {
          let html = `<strong>${d.label}</strong><br>`;

          if (d.type === "movie") {
              html += `
                Rating: ${d.vote_average}<br>
                Budget: $${d.budget.toLocaleString()}<br>
                Revenue: $${d.revenue.toLocaleString()}<br>
              `;
          }

          if (d.type === "genre") {
              html += `Genre`;
          }

          if (d.type === "company") {
              html += `Production Company`;
          }

          tooltip.style("opacity", 1).html(html);
      })
      .on("mousemove", (event) => {
          tooltip.style("left", (event.pageX + 10) + "px")
                 .style("top", (event.pageY + 10) + "px");
      })
      .on("mouseout", () => tooltip.style("opacity", 0))
      .call(
        d3.drag()
          .on("start", dragStart)
          .on("drag", dragged)
          .on("end", dragEnd)
      );

  simulation.on("tick", () => {
    link
      .attr("x1", d => d.source.x)
      .attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x)
      .attr("y2", d => d.target.y);

    node
      .attr("cx", d => d.x)
      .attr("cy", d => d.y);
  });

  function dragStart(event, d) {
      if (!event.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x;
      d.fy = d.y;
  }

  function dragged(event, d) {
      d.fx = event.x;
      d.fy = event.y;
  }

  function dragEnd(event, d) {
      if (!event.active) simulation.alphaTarget(0);
      d.fx = null;
      d.fy = null;
  }

});
</script>
